    task_group: aggregate
    batch_size: 32
    num_fewshot: 8
    report_metric:
      - alias: mgsm_native_cot_es
        metric: exact_match,symbolic-match
      - alias: mgsm_native_cot_de
        metric: exact_match,symbolic-match
      - alias: mgsm_native_cot_fr
