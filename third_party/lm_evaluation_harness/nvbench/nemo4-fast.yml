### Reduced N4 evaluation suite sized for high-throughput dynamic inference.
version: 1.0
tasks:
  - task_name: mmlu_pro_cot_mini_5_shot_base
    task_group: aggregate
    batch_size: 32
    num_fewshot: 5
    report_metric:
      - alias: mmlu_pro_cot_mini_5_shot_base
        metric: exact_match,tigerlab-extract
  - task_name: mbpp_sanitized_3shot_sampled
    task_group: code
    batch_size: 128
    overrides:
      repeats: 20
    report_metric:
      - alias: mbpp_sanitized_3shot_sampled
        metric: pass@1[20],evalplus_sanitized
  - task_name: humaneval_sampled
    task_group: code
    batch_size: 128
    overrides:
      repeats: 20
    report_metric:
      - alias: humaneval_sampled
        metric: pass@1[20],evalplus_sanitized
  - task_name: math_500_sampled
    task_group: math
    batch_size: 128
    num_fewshot: 4
    overrides:
      repeats: 4
    report_metric:
      - alias: math_500_sampled
        metric: pass@1[4],math_verify
  - task_name: gsm8k_cot_nemo
    task_group: math
    batch_size: 64
    num_fewshot: 8
    report_metric:
      - alias: gsm8k_cot_nemo
        metric: exact_match,none
  - task_name: race
    task_group: reading_comprehension
    batch_size: 32
    report_metric:
      - alias: race
        metric: acc,none
  - task_name: arc_challenge_llama
    task_group: base_reasoning
    batch_size: 32
    num_fewshot: 25
    report_metric:
      - alias: arc_challenge_llama
        metric: acc_norm,none
  - task_name: winogrande
    task_group: reasoning
    batch_size: 64
    report_metric:
      - alias: winogrande
        metric: acc,none
  - task_name: adlr_global_mmlu
    task_group: aggregate
    batch_size: 32
    num_fewshot: 5
    report_metric:
      - alias: global_mmlu_de
        metric: acc,none
      - alias: global_mmlu_es
        metric: acc,none
      - alias: global_mmlu_fr
        metric: acc,none
      - alias: global_mmlu_it
        metric: acc,none
      - alias: global_mmlu_ja
        metric: acc,none
      - alias: global_mmlu_ko
        metric: acc,none
      - alias: global_mmlu_pt
        metric: acc,none
      - alias: global_mmlu_zh
