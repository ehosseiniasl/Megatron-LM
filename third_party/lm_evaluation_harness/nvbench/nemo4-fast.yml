    task_group: aggregate
    batch_size: 32
    num_fewshot: 5
    report_metric:
      - alias: mmlu_str
        metric: exact_match,none
      - alias: mmlu_str_stem
        metric: exact_match,none
  - task_name: llm_compression_2026_cc_interleaved
    task_group: compression
    batch_size: 8
    report_metric:
      - alias: llm_compression_2026_cc_interleaved
        metric: bits_per_byte
  - task_name: llm_compression_2026_arxiv_interleaved
