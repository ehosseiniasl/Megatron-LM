task: aptbench_issue_fix_action
tag:
  - aptbench
  - issue_fix
dataset_path: nvidia/APTBench
dataset_name: null
dataset_kwargs:
  data_files: issue_fix/action.jsonl
training_split: null
validation_split: null
test_split: train
output_type: generate_until
doc_to_text: !function utils.doc_to_text_action
doc_to_target: !function utils.doc_to_target_action
process_results: !function utils.process_results_action
generation_kwargs:
  do_sample: false
  temperature: 0.0
  max_gen_toks: 50
  until:
    - "\n"
    - "```"
    - "</s>"
    - "<|im_end|>"
    - "<|endoftext|>"
    - "<|eot_id|>"
num_fewshot: 0
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
  description: "APTBench Issue Fix - Action: Generate the next execution command from a tool set based on previous trajectory. Tests command-level execution for bug fixing."
