task: aptbench_agentic_math_feedback_tf
tag:
  - aptbench
  - agentic_math
dataset_path: nvidia/APTBench
dataset_name: null
dataset_kwargs:
  data_files: agentic_math/feedback_tf.jsonl
training_split: null
validation_split: null
test_split: train
output_type: generate_until
doc_to_text: !function utils.doc_to_text_feedback_tf
doc_to_target: !function utils.doc_to_target_feedback_tf
process_results: !function utils.process_results_feedback_tf
generation_kwargs:
  do_sample: false
  temperature: 0.0
  max_gen_toks: 10
  until:
    - "\n"
    - "</s>"
    - "<|im_end|>"
    - "<|endoftext|>"
    - "<|eot_id|>"
num_fewshot: 0
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
  description: "APTBench Agentic Math - Feedback True/False: Judge whether a proposed solution to a math problem is correct or wrong. Tests the ability to verify mathematical reasoning and identify errors in solutions."
