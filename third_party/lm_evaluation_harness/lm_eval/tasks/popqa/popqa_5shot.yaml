task: popqa_5shot
dataset_path: akariasai/PopQA
output_type: generate_until
process_docs: !function utils.process_docs
test_split: test
# PopQA is hosted with only a test split; few-shot examples are drawn from that split.
fewshot_split: test
doc_to_text: "Question: {{question}}\nAnswer:"
doc_to_target: !function utils.doc_to_target
generation_kwargs:
  until:
    - "\n"
    - "."
    - ","
  do_sample: false
  temperature: 0.0
filter_list:
  - name: remove_whitespace
    filter:
      - function: remove_whitespace
      - function: take_first
target_delimiter: " "
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
    regexes_to_ignore:
      - "\\b(?:The |the |An |A |The |a |an )"
num_fewshot: 5
metadata:
  version: 1.0
