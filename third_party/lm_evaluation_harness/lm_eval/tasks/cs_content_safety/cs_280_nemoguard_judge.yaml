task: cs_280_nemoguard_judge
dataset_path: json
dataset_name: null
dataset_kwargs:
  data_files: lm_eval/tasks/cs_content_safety/cs_280.jsonl
training_split: null
validation_split: null
test_split: train
doc_to_target: "no_target"
doc_to_text: "{{prompt}}"
output_type: generate_until
generation_kwargs:
  do_sample: true
  temperature: 0.9
  max_gen_toks: 50
  until:
    - "</s>"
    - "<|im_end|>"
    - "<|endoftext|>"
    - "<|eot_id|>"
process_results: !function utils.process_nemoguard_results
metric_list:
  - metric: safety_score
    aggregation: mean
    higher_is_better: true
  - metric: judge_response
    aggregation: bypass
tag:
  - content_safety
metadata:
  version: 1.0