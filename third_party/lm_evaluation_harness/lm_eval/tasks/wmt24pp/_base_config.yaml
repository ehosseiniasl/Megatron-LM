dataset_path: google/wmt24pp
output_type: generate_until
test_split: train
fewshot_split: train
num_fewshot: 0
fewshot_config:
  sampler: first_n
doc_to_target: "{{target.strip()}}"
process_docs: !function utils.process_docs
process_results: !function utils.process_results
metric_list:
  - metric: chrf++
    aggregation: !function utils.chrfpp_agg
    higher_is_better: true
metadata:
  version: 1.0
