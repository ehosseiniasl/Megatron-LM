tag:
  - factuality
  - knowledge
task: simpleqa_5shot
dataset_path: basicv8vc/SimpleQA
output_type: generate_until
test_split: test
num_fewshot: 5
fewshot_config:
  sampler: first_n
  samples:
    - problem: "What is the capital city of France?"
      answer: "Paris"
    - problem: "Who wrote the novel Pride and Prejudice?"
      answer: "Jane Austen"
    - problem: "What is the chemical symbol for gold?"
      answer: "Au"
    - problem: "In what year did Apollo 11 land on the Moon?"
      answer: "1969"
    - problem: "What is the largest planet in the Solar System?"
      answer: "Jupiter"
description: "Answer each question with a short factual answer.\n\n"
doc_to_text: "Q: {{problem}}\nA:"
doc_to_target: "{{answer}}"
target_delimiter: " "
fewshot_delimiter: "\n\n"
generation_kwargs:
  until:
    - "\n"
    - "</s>"
    - "<|im_end|>"
    - "<|eot_id|>"
    - "<|end_of_text|>"
  do_sample: false
  temperature: 0.0
  max_gen_toks: 64
process_results: !function utils.process_results
should_decontaminate: true
doc_to_decontamination_query: problem
metric_list:
  - metric: correct
    aggregation: mean
    higher_is_better: true
  - metric: incorrect
    aggregation: mean
    higher_is_better: false
  - metric: not_attempted
    aggregation: mean
    higher_is_better: false
  - metric: f1
    aggregation: !function utils.simpleqa_f1_agg
    higher_is_better: true
metadata:
  version: 1.0
