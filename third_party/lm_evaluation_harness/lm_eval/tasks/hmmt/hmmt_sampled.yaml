task: hmmt_sampled
include: hmmt.yaml
num_fewshot: 0
description: "Solve the following math problem. Show your work and put your final answer in \\boxed{}.\n\n"
doc_to_text: "Problem:\n{{problem}}\n\nLet's think step by step:"
process_results: !function metrics.code_eval.estimate_pass_at_k_dynamic
filter_list:
  - filter:
      - function: symbolic_match
    name: math_verify
generation_kwargs:
  max_gen_toks: 2048
  until:
    - "Problem:"
    - "Question:"
    - "</s>"
    - "<|im_end|>"
    - "<|endoftext|>"
    - "<|eot_id|>"
    - "<extra_id_1>"
  do_sample: true
  temperature: 0.7
repeats: 8
metric_list: []
