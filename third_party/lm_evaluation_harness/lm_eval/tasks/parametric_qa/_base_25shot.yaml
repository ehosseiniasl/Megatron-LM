tag:
  - factuality
  - knowledge
  - base_model
output_type: generate_until
num_fewshot: 25
fewshot_config:
  sampler: first_n
  samples:
    - question: "What is the capital city of France?"
      answer: "Paris"
    - question: "Who wrote the novel Pride and Prejudice?"
      answer: "Jane Austen"
    - question: "What is the chemical symbol for gold?"
      answer: "Au"
    - question: "In what year did Apollo 11 land on the Moon?"
      answer: "1969"
    - question: "What is the largest planet in the Solar System?"
      answer: "Jupiter"
    - question: "Who painted The Starry Night?"
      answer: "Vincent van Gogh"
    - question: "What is the currency of Japan?"
      answer: "The yen"
    - question: "What is the chemical formula for water?"
      answer: "H2O"
    - question: "Who wrote Hamlet?"
      answer: "William Shakespeare"
    - question: "What is the tallest mountain above sea level?"
      answer: "Mount Everest"
    - question: "What is the capital city of Canada?"
      answer: "Ottawa"
    - question: "What is the official language of Brazil?"
      answer: "Portuguese"
    - question: "What is the first element in the periodic table?"
      answer: "Hydrogen"
    - question: "What is the largest ocean on Earth?"
      answer: "The Pacific Ocean"
    - question: "In what year was the United States Declaration of Independence adopted?"
      answer: "1776"
    - question: "Who composed The Four Seasons?"
      answer: "Antonio Vivaldi"
    - question: "What is the square root of 144?"
      answer: "12"
    - question: "Which planet is known as the Red Planet?"
      answer: "Mars"
    - question: "What is the capital city of Kenya?"
      answer: "Nairobi"
    - question: "Who developed the theory of relativity?"
      answer: "Albert Einstein"
    - question: "What is the atomic number of oxygen?"
      answer: "8"
    - question: "Who wrote the novel 1984?"
      answer: "George Orwell"
    - question: "What is the largest living mammal?"
      answer: "The blue whale"
    - question: "What is the currency of Switzerland?"
      answer: "The Swiss franc"
    - question: "Which planet is famous for its prominent ring system?"
      answer: "Saturn"
description: "Answer each question with a short factual answer.\n\n"
doc_to_text: "Q: {{question}}\nA:"
doc_to_target: "{{answer}}"
target_delimiter: " "
fewshot_delimiter: "\n\n"
generation_kwargs:
  until:
    - "\n"
    - "</s>"
    - "<|im_end|>"
    - "<|eot_id|>"
    - "<|end_of_text|>"
  do_sample: false
  temperature: 0.0
  max_gen_toks: 64
process_results: !function utils.process_results
should_decontaminate: true
doc_to_decontamination_query: question
metric_list:
  - metric: judge_accuracy
    aggregation: !function utils.aggregate_judge_accuracy
    higher_is_better: true
  - metric: reference_match
    aggregation: mean
    higher_is_better: true
  - metric: response_nonempty
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
  default_judge_model: openai/gpt-oss-120b
  default_judge_concurrency: 128
