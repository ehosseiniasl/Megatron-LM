    - query: "    $$(x-6)^{2}+(y+5)^{2}=16$$In the $x y$-plane, the graph of the equation above is a circle. Point $P$ is on the circle and has coordinates $(10,-5)$. If $\\overline{P Q}$ is a diameter of the circle, what are the coordinates of point $Q$ ? \n   A. $(2,-5)$\n   B. $(6,-1)$\n   C. $(6,-5)$\n   D. $(6,-9)$\n"
