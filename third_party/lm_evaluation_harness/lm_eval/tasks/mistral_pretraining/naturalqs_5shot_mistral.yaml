task: naturalqs_5shot_mistral
dataset_path: google-research-datasets/nq_open
output_type: generate_until
training_split: train
validation_split: validation
process_docs: !function utils.process_naturalqs
description: "Answer these questions:\n{{ '' }}"
doc_to_text: "Q: {{question}}\nA:"
doc_to_target: "{{answer}}"
target_delimiter: " "
fewshot_delimiter: "\n"
num_fewshot: 5
fewshot_config:
  sampler: !function utils.ThunderdomeSampler
generation_kwargs:
  until: ["\n", ".", ","]
  max_gen_toks: 256
  do_sample: false
  temperature: 0.0
filter_list:
  - name: remove_whitespace
    filter:
      - function: remove_whitespace
      - function: take_first
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
metadata:
  version: 1.0
  source_task: thunderdome:naturalqs_5shot
