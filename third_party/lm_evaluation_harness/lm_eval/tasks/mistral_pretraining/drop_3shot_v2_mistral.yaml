task: drop_3shot_v2_mistral
dataset_path: EleutherAI/drop
output_type: generate_until
validation_split: validation
fewshot_split: validation
process_docs: !function utils.process_drop
doc_to_text: "{{query}}\nA:"
doc_to_target: answers
target_delimiter: " "
fewshot_delimiter: "\n\n"
num_fewshot: 3
fewshot_config:
  sampler: !function utils.ThunderdomeSampler
generation_kwargs:
  until: ["\n"]
  max_gen_toks: 128
  do_sample: false
  temperature: 0.0
process_results: !function utils.process_drop_results
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
  - metric: f1
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
  source_task: thunderdome:drop_3shot_v2
