task: popqa_5shot_mistral
dataset_path: akariasai/PopQA
output_type: generate_until
test_split: test
fewshot_split: test
process_docs: !function utils.process_popqa
description: "Answer these questions:\n{{ '' }}"
doc_to_text: "Q: {{question}}\nA:"
doc_to_target: answers
target_delimiter: " "
fewshot_delimiter: "\n"
num_fewshot: 5
fewshot_config:
  sampler: !function utils.ThunderdomeSampler
generation_kwargs:
  until: ["\n"]
  max_gen_toks: 256
  do_sample: false
  temperature: 0.0
filter_list:
  - name: remove_whitespace
    filter:
      - function: remove_whitespace
      - function: take_first
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
metadata:
  version: 1.0
  source_task: thunderdome:popqa_5shot
