task: siqa_mistral
dataset_path: baber/social_i_qa
output_type: multiple_choice
validation_split: validation
doc_to_text: "{{context}}\nQuestion: {{question}}\nAnswer:"
doc_to_target: "{{(label|int) - 1}}"
doc_to_choice: "{{[answerA.strip(), answerB.strip(), answerC.strip()]}}"
process_results: !function utils.process_siqa_results
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
  source_task: thunderdome:siqa
