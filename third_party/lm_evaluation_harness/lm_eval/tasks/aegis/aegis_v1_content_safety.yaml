task: aegis_v1_content_safety
dataset_path: nvidia/Aegis-AI-Content-Safety-Dataset-1.0
test_split: test
doc_to_target: "no_target"
doc_to_text: "{{text}}"
generation_kwargs:
  do_sample: true
  temperature: 0.9
  max_gen_toks: 50
  until:
    - "</s>"
    - "<|im_end|>"

output_type: generate_until

metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
  - metric: grading_meta
    aggregation: bypass

tag:
  - content_safety
metadata:
  version: 1.0

process_results: !function v1_utils.process_results
