[build-system]
requires = ["setuptools>=40.8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lm_eval"
version = "0.4.3"
authors = [{ name = "EleutherAI", email = "contact@eleuther.ai" }]
description = "A framework for evaluating language models"
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10,<3.14"
dependencies = [
    "accelerate>=0.26.0",
    "evalplus",             # for code evals
    "datasets>=4.0.0,<5",
    "evaluate>=0.4.0",
    "tenacity",
    "jsonlines",
    "numexpr",
    "peft>=0.2.0",
    "pybind11>=2.6.2",
    "pytablewriter",
    "rouge-score>=0.0.4",
    "sacrebleu>=1.5.0",
    "scikit-learn>=0.24.1",
    "sqlitedict",
    "torch>=1.8",
    "tqdm-multiprocess",
    "transformers>=5.5.0,<6",
    "zstandard",
    "word2number",
    "more_itertools",
    "omegaconf",
    # adlr dependencies (default for all installs)
    "openai>1.3.9",
    "tiktoken",
    "sympy>=1.12",
    "math-verify>=0.8.0,<0.9.0",
    "langdetect",
    "immutabledict",
    "nltk",
    "wonderwords",
    "scipy",
    "pillow",  # required by datasets>=4 to decode Image columns (e.g., cais/hle)
]

[tool.setuptools.packages.find]
include = ["lm_eval*"]

# required to include yaml files in pip installation
[tool.setuptools.package-data]
lm_eval = ["**/*.yaml", "tasks/**/*"]

[project.scripts]
lm-eval = "lm_eval.__main__:cli_evaluate"
lm_eval = "lm_eval.__main__:cli_evaluate"

[project.urls]
Homepage = "https://github.com/EleutherAI/lm-evaluation-harness"
Repository = "https://github.com/EleutherAI/lm-evaluation-harness"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pytest-xdist", "pre-commit", "mypy"]
adlr = []

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["lm_eval"]

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["F401", "F402", "F403"]

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
lm_eval = { path = ".", editable = true, extras = ["adlr"] }

[tool.pixi.build-dependencies]
black = "*"

[tool.pixi.tasks]

[tool.pixi.dependencies]
python = ">=3.10,<3.14"
yamlfmt = ">=0.17.2,<0.18"
