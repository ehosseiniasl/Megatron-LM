# Complete CrabMo v1 NVIDIA mixture as of 2026-08-26.
# NO_WEIGHTS: every logical datasource has the placeholder weight 1.0.
# Adapted from https://github.com/mistralai/mistral/pull/29027/changes#diff-290c3e9a0f1ed9524b1d20b095d730780ea79c43a0645915e5f9ab8884cdfd50
# Megatron-specific changes:
# - Use the shared N4-v6 tokenizer.
# - Use the shared JSONL data root.
# - Use multimodal_v4__lobstral and configure rare-token/PDS filters explicitly;
#   their values are validated against the tokenizer and sample type.
# - Replace the nine previously commented grounding paths with the three
#   combined grounding sources validated by pretok job 20788. The source paths
#   changed, while their filter, transform, masking, rare-token, and PDS
#   settings remain the same.
# - Add the missing dataset-directory level for three multilingual sources;
#   each child directory is listed because preflight checks direct JSONL files.
# - Keep three translated docsv5 sources disabled because their cluster data is
#   missing l2_reconstruction_score annotations. Enable the translated JA/KO
#   math source after validation by pretok job 20788.
# - Add the EN, JA/KO, RU, and ZH docsv5.1 *_low sources. These paths were not
#   present in the previous main config and were validated by pretok job 20788.
# - Re-enable the 61 Docsv5.1 sources after their dedicated pretok and merge
#   completed successfully on 2026-08-25.
# - Add union-v1-structured with the same file-separator masking used for the
#   existing repos_v1 code sources; its dedicated merge also completed.
# - Restore the synthetic sources using the corrected paths from
#   https://github.com/NVIDIA-NeMo/nv-mistralai-megatron/pull/269/changes.
# - Enable grounding now that PR 304 brings multimodal_v1__grounding and
#   grounding_default to main.
